name: Phoenix Intake and Template Match

on:
  workflow_dispatch:
    inputs:
      requirement:
        description: "Client requirement (plain text)"
        required: true
        type: string
      client_name:
        description: "Optional client label"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phoenix repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run intake and deterministic matcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLIENT_REQUIREMENT: ${{ github.event.inputs.requirement }}
          CLIENT_NAME: ${{ github.event.inputs.client_name }}
        run: |
          if [ -n "$CLIENT_REQUIREMENT" ]; then
            python phoenix.py --text "$CLIENT_REQUIREMENT" --client-name "$CLIENT_NAME"
          else
            echo "Scheduled run has no queued intake yet; nothing to process."
          fi

      - name: Commit lead state for manual review
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "phoenix-actions"
          git config user.email "phoenix-actions@users.noreply.github.com"
          git add leads.json history.json builds/
          git diff --cached --quiet || git commit -m "Phoenix: record intake and template match"
          git push
